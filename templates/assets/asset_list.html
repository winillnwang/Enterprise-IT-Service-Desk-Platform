{% extends "base.html" %}
{% block title %}資產管理｜企業 IT 維運暨工單管理平台{% endblock %}
{% block page_heading %}資產管理{% endblock %}
{% block content %}
<script>document.body.classList.add("legacy-dashboard");</script>

<head>
    <meta charset="UTF-8">
    <title>資產管理</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f7fa;
            color: #222;
        }

        .page-header {
            background-color: #1f3b5b;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .page-header h1 {
            margin: 0;
            font-size: 24px;
        }

        .user-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        #current-user {
            font-size: 14px;
        }

        #logout-button {
            padding: 7px 14px;
            border: 1px solid white;
            border-radius: 6px;
            background-color: transparent;
            color: white;
            cursor: pointer;
        }

        #logout-button:hover {
            background-color: white;
            color: #1f3b5b;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .page-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .page-title-row h2 {
            margin: 0;
        }

        .action-link {
            display: inline-block;
            margin-right: 10px;
            padding: 10px 18px;
            border-radius: 6px;
            background-color: #1f3b5b;
            color: white;
            text-decoration: none;
        }

        .action-link:hover {
            background-color: #162c44;
        }

        .back-link {
            display: inline-block;
            margin-left: 10px;
            padding: 10px 18px;
            border-radius: 6px;
            background-color: #e5e7eb;
            color: #222;
            text-decoration: none;
        }

        .back-link:hover {
            background-color: #d1d5db;
        }

        .filter-card {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.08);
            margin-bottom: 20px;

            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: end;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .filter-group label {
            font-weight: bold;
            color: #555;
            font-size: 14px;
        }

        .filter-group input,
        .filter-group select {
            min-width: 180px;
            padding: 9px 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .filter-buttons {
            display: flex;
            gap: 8px;
        }

        .filter-button,
        .reset-button {
            padding: 9px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .filter-button {
            background-color: #1f3b5b;
            color: white;
        }

        .reset-button {
            background-color: #e5e7eb;
            color: #222;
        }

        .card {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.08);
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px 10px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
        }

        th {
            background-color: #f8fafc;
            color: #555;
        }

        .badge {
            display: inline-block;
            padding: 4px 9px;
            border-radius: 12px;
            font-size: 13px;
        }

        .status-available {
            background-color: #e8f5e9;
        }

        .status-in_use {
            background-color: #e3f2fd;
        }

        .status-maintenance {
            background-color: #fff3cd;
        }

        .status-retired {
            background-color: #eeeeee;
        }

        .asset-link {
            color: #1f3b5b;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="page-header">

        <h1>
            企業 IT 維運暨工單管理平台
        </h1>

        <div class="user-area">

            <span id="current-user">
                使用者載入中...
            </span>

            <button id="logout-button">
                登出
            </button>

        </div>
    </div>


    <div class="container">

        <div class="page-title-row">

            <h2 id="asset-page-title">
                資產管理
            </h2>

            <div>
                <a
                    id="create-asset-link"
                    href="/assets/create/"
                    class="action-link"
                    style="display: none;"
                >
                    新增資產
                </a>

                <a
                    id="asset-back-link"
                    href="/dashboard/"
                    class="back-link"
                >
                    返回 Dashboard
                </a>
            </div>

        </div>

        <div class="filter-card">

            <div class="filter-group">

                <label for="search-input">
                    搜尋
                </label>

                <input
                    id="search-input"
                    type="text"
                    placeholder="搜尋資產名稱"
                >

            </div>


            <div class="filter-group">

                <label for="status-filter">
                    狀態
                </label>

                <select id="status-filter">

                    <option value="">
                        全部狀態
                    </option>

                    <option value="available">
                        可用
                    </option>

                    <option value="in_use">
                        使用中
                    </option>

                    <option value="maintenance">
                        維修中
                    </option>

                    <option value="retired">
                        已報廢
                    </option>

                </select>

            </div>


            <div class="filter-group">

                <label for="type-filter">
                    類型
                </label>

                <select id="type-filter">

                    <option value="">
                        全部類型
                    </option>

                    <option value="laptop">
                        筆記型電腦
                    </option>

                    <option value="desktop">
                        桌上型電腦
                    </option>

                    <option value="monitor">
                        螢幕
                    </option>

                    <option value="phone">
                        手機
                    </option>

                    <option value="printer">
                        印表機
                    </option>

                    <option value="network">
                        網路設備
                    </option>

                    <option value="other">
                        其他
                    </option>

                </select>

            </div>


            <div class="filter-group">

                <label for="department-filter">
                    部門
                </label>

                <select id="department-filter">

                    <option value="">
                        全部部門
                    </option>

                </select>

            </div>


            <div class="filter-buttons">

                <button
                    id="filter-button"
                    class="filter-button"
                >
                    搜尋
                </button>

                <button
                    id="reset-button"
                    class="reset-button"
                >
                    清除
                </button>

            </div>

        </div>
        <div class="card">

            <div class="table-wrapper">

                <table>

                    <thead>
                        <tr>
                            <th>資產編號</th>
                            <th>資產名稱</th>
                            <th>類型</th>
                            <th>狀態</th>
                            <th>使用者</th>
                            <th>部門</th>
                            <th>保固期限</th>
                        </tr>
                    </thead>

                    <tbody id="asset-table-body">
                        <tr>
                            <td colspan="7">
                                載入中...
                            </td>
                        </tr>
                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <script>

        function getStatusLabel(status) {
            const labels = {
                available: "可用",
                in_use: "使用中",
                maintenance: "維修中",
                retired: "已報廢"
            };

            return labels[status] || status;
        }


        function getAssetTypeLabel(type) {
            const labels = {
                laptop: "筆記型電腦",
                desktop: "桌上型電腦",
                monitor: "螢幕",
                phone: "手機",
                printer: "印表機",
                network: "網路設備",
                other: "其他"
            };

            return labels[type] || type;
        }


        async function refreshAccessToken() {
            const refreshToken =
                localStorage.getItem(
                    "refresh_token"
                );

            if (!refreshToken) {
                return null;
            }

            const response = await fetch(
                "/api/auth/refresh/",
                {
                    method: "POST",
                    headers: {
                        "Content-Type":
                            "application/json"
                    },
                    body: JSON.stringify({
                        refresh: refreshToken
                    })
                }
            );

            if (!response.ok) {
                localStorage.removeItem(
                    "access_token"
                );

                localStorage.removeItem(
                    "refresh_token"
                );

                return null;
            }

            const data =
                await response.json();

            localStorage.setItem(
                "access_token",
                data.access
            );

            return data.access;
        }


        async function apiFetch(url) {
            let accessToken =
                localStorage.getItem(
                    "access_token"
                );

            let response = await fetch(
                url,
                {
                    headers: {
                        "Authorization":
                            `Bearer ${accessToken}`
                    }
                }
            );

            if (response.status === 401) {
                accessToken =
                    await refreshAccessToken();

                if (!accessToken) {
                    window.location.href =
                        "/login/";

                    return null;
                }

                response = await fetch(
                    url,
                    {
                        headers: {
                            "Authorization":
                                `Bearer ${accessToken}`
                        }
                    }
                );
            }

            return response;
        }


        async function loadCurrentUser() {
            const response =
                await apiFetch(
                    "/api/auth/me/"
                );

            if (
                !response
                || !response.ok
            ) {
                window.location.href =
                    "/login/";

                return null;
            }

            const user =
                await response.json();

            document.getElementById(
                "current-user"
            ).textContent =
                `${user.username}｜${user.role}`;

            return user;
        }


        async function loadDepartments() {
            const response =
                await apiFetch(
                    "/api/departments/"
                );

            if (
                !response
                || !response.ok
            ) {
                return;
            }

            const departments =
                await response.json();

            const select =
                document.getElementById(
                    "department-filter"
                );

            select.innerHTML =
                '<option value="">全部部門</option>';

            for (const department of departments) {
                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    department.id;

                option.textContent =
                    `${department.code} - ${department.name}`;

                select.appendChild(
                    option
                );
            }
        }

        async function loadAssets() {
            const search =
                document.getElementById(
                    "search-input"
                ).value.trim();

            const status =
                document.getElementById(
                    "status-filter"
                ).value;

            const assetType =
                document.getElementById(
                    "type-filter"
                ).value;

            const department =
                document.getElementById(
                    "department-filter"
                ).value;


            const params =
                new URLSearchParams();


            if (search) {
                params.append(
                    "search",
                    search
                );
            }

            if (status) {
                params.append(
                    "status",
                    status
                );
            }

            if (assetType) {
                params.append(
                    "asset_type",
                    assetType
                );
            }

            if (department) {
                params.append(
                    "department",
                    department
                );
            }


            let url =
                "/api/assets/";


            if (params.toString()) {
                url += `?${params.toString()}`;
            }


            const response =
                await apiFetch(
                    url
                );

            const tbody =
                document.getElementById(
                    "asset-table-body"
                );

            if (
                !response
                || !response.ok
            ) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7">
                            無法載入資產資料
                        </td>
                    </tr>
                `;

                return;
            }

            const assets =
                await response.json();


            if (assets.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7">
                            目前沒有資產資料
                        </td>
                    </tr>
                `;

                return;
            }


            tbody.innerHTML = "";


            for (const asset of assets) {
                const row =
                    document.createElement(
                        "tr"
                    );

                const assignedTo =
                    asset.assigned_to
                        ? asset.assigned_to.username
                        : "尚未指派";

                const department =
                    asset.department
                        ? `${asset.department.code} - ${asset.department.name}`
                        : "-";

                const warrantyEnd =
                    asset.warranty_end
                        || "-";


                row.innerHTML = `
                    <td>
                        <a
                            href="/assets/${asset.id}/"
                            class="asset-link"
                        >
                            ${asset.asset_no}
                        </a>
                    </td>

                    <td>
                        ${asset.name}
                    </td>

                    <td>
                        ${getAssetTypeLabel(
                            asset.asset_type
                        )}
                    </td>

                    <td>
                        <span
                            class="badge status-${asset.status}"
                        >
                            ${getStatusLabel(
                                asset.status
                            )}
                        </span>
                    </td>

                    <td>
                        ${assignedTo}
                    </td>

                    <td>
                        ${department}
                    </td>

                    <td>
                        ${warrantyEnd}
                    </td>
                `;

                tbody.appendChild(row);
            }
        }

        async function initializePage() {
            const user =
                await loadCurrentUser();

            if (!user) {
                return;
            }


            const title =
                document.getElementById(
                    "asset-page-title"
                );

            const backLink =
                document.getElementById(
                    "asset-back-link"
                );

            const createAssetLink =
                document.getElementById(
                    "create-asset-link"
                );


            if (
                user.role === "employee"
            ) {
                title.textContent =
                    "我的資產";

                backLink.href =
                    "/tickets/";

                backLink.textContent =
                    "返回我的工單";

                createAssetLink.style.display =
                    "none";
            } else if (
                [
                    "it_engineer",
                    "it_manager",
                    "admin"
                ].includes(
                    user.role
                )
            ) {
                title.textContent =
                    "資產管理";

                backLink.href =
                    "/dashboard/";

                backLink.textContent =
                    "返回 Dashboard";

                createAssetLink.style.display =
                    "inline-block";
            }

            await loadDepartments();
            await loadAssets();
}

        document
            .getElementById(
                "logout-button"
            )
            .addEventListener(
                "click",
                function () {
                    localStorage.removeItem(
                        "access_token"
                    );

                    localStorage.removeItem(
                        "refresh_token"
                    );

                    window.location.href =
                        "/login/";
                }
            );

        document
            .getElementById(
                "filter-button"
            )
            .addEventListener(
                "click",
                loadAssets
            );


        document
            .getElementById(
                "reset-button"
            )
            .addEventListener(
                "click",
                function () {
                    document.getElementById(
                        "search-input"
                    ).value = "";

                    document.getElementById(
                        "status-filter"
                    ).value = "";

                    document.getElementById(
                        "type-filter"
                    ).value = "";

                    document.getElementById(
                        "department-filter"
                    ).value = "";

                    loadAssets();
                }
            );

        document.addEventListener(
            "DOMContentLoaded",
            initializePage
        );

    </script>

</body>

{% endblock %}
