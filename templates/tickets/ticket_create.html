{% extends "base.html" %}
{% block title %}新增工單｜企業 IT 維運暨工單管理平台{% endblock %}
{% block page_heading %}新增工單{% endblock %}
{% block content %}
<style>
.container {
            width: 90%;
            max-width: 800px;
            margin: 30px auto;
        }

        .form-card {
            background-color: white;
            padding: 28px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            box-sizing: border-box;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        .form-group textarea {
            min-height: 140px;
            resize: vertical;
        }

        .button-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .submit-button {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            background-color: #1f3b5b;
            color: white;
            cursor: pointer;
        }

        .back-link {
            padding: 10px 18px;
            border-radius: 6px;
            background-color: #e5e7eb;
            color: #222;
            text-decoration: none;
        }

        #message {
            margin-top: 15px;
        }
    </style>

    <div class="container">

        <div class="form-card">

            <h2>新增工單</h2>

            <form id="ticket-form">

                <div class="form-group">
                    <label for="title">
                        標題
                    </label>

                    <input
                        type="text"
                        id="title"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="description">
                        問題描述
                    </label>

                    <textarea
                        id="description"
                        required
                    ></textarea>
                </div>


                <div class="form-group">
                    <label for="category_id">
                        分類
                    </label>
                    <select
                        id="category_id"
                        required
                    >
                        <option value="">
                            分類載入中...
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="priority">
                        優先級
                    </label>

                    <select
                        id="priority"
                        required
                    >
                        <option value="low">
                            低
                        </option>

                        <option value="medium" selected>
                            中
                        </option>

                        <option value="high">
                            高
                        </option>

                        <option value="critical">
                            緊急
                        </option>
                    </select>
                </div>


                <div class="button-row">

                    <button
                        type="submit"
                        class="submit-button"
                    >
                        建立工單
                    </button>

                    <a
                        href="/tickets/"
                        class="back-link"
                    >
                        返回工單列表
                    </a>

                </div>

                <p id="message"></p>

            </form>

        </div>

    </div>


    <script>

        const form =
            document.getElementById("ticket-form");

        const message =
            document.getElementById("message");


        function getRoleLabel(role) {
            const labels = {
                employee: "一般員工",
                it_engineer: "IT 工程師",
                it_manager: "IT 管理者",
                admin: "系統管理員"
            };

            return labels[role] || role;
        }


        async function refreshAccessToken() {
            const refreshToken =
                localStorage.getItem("refresh_token");

            if (!refreshToken) {
                return null;
            }

            const response = await fetch(
                "/api/auth/refresh/",
                {
                    method: "POST",
                    headers: {
                        "Content-Type":
                            "application/json"
                    },
                    body: JSON.stringify({
                        refresh: refreshToken
                    })
                }
            );

            if (!response.ok) {
                localStorage.removeItem(
                    "access_token"
                );

                localStorage.removeItem(
                    "refresh_token"
                );

                return null;
            }

            const data =
                await response.json();

            localStorage.setItem(
                "access_token",
                data.access
            );

            return data.access;
        }


        async function loadCurrentUser() {
            let accessToken =
                localStorage.getItem("access_token");

            let response = await fetch(
                "/api/auth/me/",
                {
                    headers: {
                        "Authorization":
                            `Bearer ${accessToken}`
                    }
                }
            );

            if (response.status === 401) {
                accessToken =
                    await refreshAccessToken();

                if (!accessToken) {
                    window.location.href =
                        "/login/";
                    return;
                }

                response = await fetch(
                    "/api/auth/me/",
                    {
                        headers: {
                            "Authorization":
                                `Bearer ${accessToken}`
                        }
                    }
                );
            }

            if (!response.ok) {
                window.location.href =
                    "/login/";
                return;
            }

            const user =
                await response.json();
}

        async function loadCategories() {
            let accessToken =
                localStorage.getItem("access_token");

            let response = await fetch(
                "/api/ticket-categories/",
                {
                    headers: {
                        "Authorization":
                            `Bearer ${accessToken}`
                    }
                }
            );

            if (response.status === 401) {
                accessToken =
                    await refreshAccessToken();

                if (!accessToken) {
                    window.location.href =
                        "/login/";

                    return;
                }

                response = await fetch(
                    "/api/ticket-categories/",
                    {
                        headers: {
                            "Authorization":
                                `Bearer ${accessToken}`
                        }
                    }
                );
            }

            if (!response.ok) {
                return;
            }

            const categories =
                await response.json();

            const categorySelect =
                document.getElementById(
                    "category_id"
                );

            categorySelect.innerHTML =
                '<option value="">請選擇分類</option>';

            for (const category of categories) {
                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    category.id;

                option.textContent =
                    category.name;

                categorySelect.appendChild(
                    option
                );
            }
        }
        async function createTicket(
            ticketData
        ) {
            let accessToken =
                localStorage.getItem(
                    "access_token"
                );

            let response = await fetch(
                "/api/tickets/",
                {
                    method: "POST",
                    headers: {
                        "Authorization":
                            `Bearer ${accessToken}`,
                        "Content-Type":
                            "application/json"
                    },
                    body:
                        JSON.stringify(
                            ticketData
                        )
                }
            );

            if (response.status === 401) {
                accessToken =
                    await refreshAccessToken();

                if (!accessToken) {
                    window.location.href =
                        "/login/";
                    return null;
                }

                response = await fetch(
                    "/api/tickets/",
                    {
                        method: "POST",
                        headers: {
                            "Authorization":
                                `Bearer ${accessToken}`,
                            "Content-Type":
                                "application/json"
                        },
                        body:
                            JSON.stringify(
                                ticketData
                            )
                    }
                );
            }

            return response;
        }


        form.addEventListener(
            "submit",
            async function (event) {
                event.preventDefault();

                const title =
                    document.getElementById(
                        "title"
                    ).value;

                const description =
                    document.getElementById(
                        "description"
                    ).value;

                const categoryId =
                    document.getElementById(
                        "category_id"
                    ).value;

                const priority =
                    document.getElementById(
                        "priority"
                    ).value;

                const ticketData = {
                    title: title,
                    description: description,
                    category_id:
                        Number(categoryId),
                    priority: priority
                };

                const response =
                    await createTicket(
                        ticketData
                    );

                if (!response) {
                    return;
                }

                const data =
                    await response.json();

                if (response.ok) {
                    window.location.href =
                        "/tickets/";
                } else {
                    message.textContent =
                        JSON.stringify(data);
                }
            }
        );
loadCurrentUser();
        loadCategories();

    </script>

{% endblock %}
