{% extends "base.html" %}

{% block title %}
工單列表｜企業 IT 維運暨工單管理平台
{% endblock %}

{% block page_heading %}
工單列表
{% endblock %}

{% block content %}

<div class="content-container">

    <div class="page-section-header">
        <div>
            <h2 class="section-title">工單列表</h2>
            <p class="section-description">
                查看、篩選與管理目前系統中的工單。
            </p>
        </div>

        <div class="page-actions">
            <a
                href="/tickets/create/"
                class="btn btn-primary"
            >
                新增工單
            </a>

            <a
                id="asset-link"
                href="/assets/"
                class="btn btn-secondary"
            >
                資產管理
            </a>
        </div>
    </div>


    <div class="card filter-card">

        <div class="filter-grid">

            <div class="form-group">
                <label for="search">
                    搜尋
                </label>

                <input
                    type="text"
                    id="search"
                    class="form-control"
                    placeholder="搜尋工單標題"
                >
            </div>


            <div class="form-group">
                <label for="status-filter">
                    狀態
                </label>

                <select
                    id="status-filter"
                    class="form-control"
                >
                    <option value="">
                        全部狀態
                    </option>

                    <option value="open">
                        待處理
                    </option>

                    <option value="assigned">
                        已指派
                    </option>

                    <option value="in_progress">
                        處理中
                    </option>

                    <option value="resolved">
                        已解決
                    </option>

                    <option value="closed">
                        已關閉
                    </option>
                </select>
            </div>


            <div class="form-group">
                <label for="priority-filter">
                    優先級
                </label>

                <select
                    id="priority-filter"
                    class="form-control"
                >
                    <option value="">
                        全部優先級
                    </option>

                    <option value="low">
                        低
                    </option>

                    <option value="medium">
                        中
                    </option>

                    <option value="high">
                        高
                    </option>

                    <option value="critical">
                        緊急
                    </option>
                </select>
            </div>


            <div class="filter-actions">

                <button
                    type="button"
                    id="filter-button"
                    class="btn btn-primary"
                >
                    篩選
                </button>

                <button
                    type="button"
                    id="reset-button"
                    class="btn btn-secondary"
                >
                    清除
                </button>

            </div>

        </div>

    </div>


    <div class="card table-card">

        <div class="table-wrapper">

            <table class="data-table">

                <thead>
                    <tr>
                        <th>工單編號</th>
                        <th>標題</th>
                        <th>分類</th>
                        <th>優先級</th>
                        <th>狀態</th>
                        <th>回報人</th>
                        <th>處理人</th>
                        <th>操作</th>
                    </tr>
                </thead>

                <tbody id="ticket-table-body">
                </tbody>

            </table>

        </div>

    </div>

</div>

{% endblock %}


{% block extra_js %}

<script>
    const accessToken =
        localStorage.getItem(
            "access_token"
        );


    function getPriorityLabel(priority) {
        const labels = {
            low: "低",
            medium: "中",
            high: "高",
            critical: "緊急"
        };

        return labels[priority] || priority;
    }


    function getStatusLabel(status) {
        const labels = {
            open: "待處理",
            assigned: "已指派",
            in_progress: "處理中",
            resolved: "已解決",
            closed: "已關閉"
        };

        return labels[status] || status;
    }


    async function loadCurrentUserForTicketPage() {
        const response = await fetch(
            "/api/auth/me/",
            {
                headers: {
                    "Authorization":
                        `Bearer ${accessToken}`
                }
            }
        );

        if (!response.ok) {
            window.location.href =
                "/login/";

            return;
        }

        const user =
            await response.json();

        const assetLink =
            document.getElementById(
                "asset-link"
            );

        if (user.role === "employee") {
            assetLink.textContent =
                "我的資產";
        } else {
            assetLink.textContent =
                "資產管理";
        }
    }


    async function loadTickets() {
        const search =
            document.getElementById(
                "search"
            ).value;

        const status =
            document.getElementById(
                "status-filter"
            ).value;

        const priority =
            document.getElementById(
                "priority-filter"
            ).value;

        const params =
            new URLSearchParams();


        if (search) {
            params.append(
                "search",
                search
            );
        }


        if (status) {
            params.append(
                "status",
                status
            );
        }


        if (priority) {
            params.append(
                "priority",
                priority
            );
        }


        const queryString =
            params.toString();

        const url =
            queryString
                ? `/api/tickets/?${queryString}`
                : "/api/tickets/";


        const response =
            await fetch(
                url,
                {
                    headers: {
                        "Authorization":
                            `Bearer ${accessToken}`
                    }
                }
            );


        const tableBody =
            document.getElementById(
                "ticket-table-body"
            );


        if (!response.ok) {
            tableBody.innerHTML = `
                <tr>
                    <td
                        colspan="8"
                        class="empty-state"
                    >
                        無法載入工單資料
                    </td>
                </tr>
            `;

            return;
        }


        const data =
            await response.json();

        tableBody.innerHTML =
            "";


        if (data.length === 0) {
            tableBody.innerHTML = `
                <tr>
                    <td
                        colspan="8"
                        class="empty-state"
                    >
                        沒有符合條件的工單
                    </td>
                </tr>
            `;

            return;
        }


        data.forEach(
            ticket => {
                const row =
                    document.createElement(
                        "tr"
                    );

                const assignee =
                    ticket.assignee
                        ? ticket.assignee.username
                        : "尚未指派";


                row.innerHTML = `
                    <td class="ticket-number">
                        ${ticket.ticket_no}
                    </td>

                    <td>
                        ${ticket.title}
                    </td>

                    <td>
                        ${ticket.category.name}
                    </td>

                    <td>
                        <span
                            class="
                                badge
                                priority-${ticket.priority}
                            "
                        >
                            ${getPriorityLabel(
                                ticket.priority
                            )}
                        </span>
                    </td>

                    <td>
                        <span
                            class="
                                badge
                                status-${ticket.status}
                            "
                        >
                            ${getStatusLabel(
                                ticket.status
                            )}
                        </span>
                    </td>

                    <td>
                        ${ticket.reporter.username}
                    </td>

                    <td>
                        ${assignee}
                    </td>

                    <td>
                        <a
                            href="/tickets/${ticket.id}/"
                            class="table-link"
                        >
                            查看詳細
                        </a>
                    </td>
                `;

                tableBody.appendChild(
                    row
                );
            }
        );
    }


    document
        .getElementById(
            "filter-button"
        )
        .addEventListener(
            "click",
            loadTickets
        );


    document
        .getElementById(
            "reset-button"
        )
        .addEventListener(
            "click",
            function () {
                document.getElementById(
                    "search"
                ).value =
                    "";

                document.getElementById(
                    "status-filter"
                ).value =
                    "";

                document.getElementById(
                    "priority-filter"
                ).value =
                    "";

                loadTickets();
            }
        );


    document.addEventListener(
        "DOMContentLoaded",
        function () {
            loadCurrentUserForTicketPage();
            loadTickets();
        }
    );

</script>

{% endblock %}
