services:
  db:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: enterprise_it_service_desk_db
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DB_NAME: enterprise_it_service_desk_db
      DB_USER: root
      DB_PASSWORD: ""
      DB_HOST: db
      DB_PORT: "3306"
    depends_on:
      - db

volumes:
  mysql_data:
